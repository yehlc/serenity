<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祥和年菜預購</title>
    <style>
        *{box-sizing:border-box;}
        body{font-family:'Helvetica Neue',Helvetica,Arial,'微軟正黑體',sans-serif;margin:0;padding:0;background:#f5f5f5;padding-bottom:80px;}
        .header{background:#8b0000;color:#fff;text-align:center;padding:15px;font-size:1.2em;font-weight:bold;position:sticky;top:0;z-index:10;}
        .pos-badge{background:#ff6f00;font-size:.75em;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
        .menu-container{padding:10px;}
        .menu-item{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;display:flex;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.05);}
        .menu-item.sold-out{opacity:.5;filter:grayscale(100%);}
        .sold-out-badge{color:#d32f2f;font-weight:bold;font-size:.9em;border:1px solid #d32f2f;padding:2px 5px;border-radius:3px;display:inline-block;margin-top:5px;}
        .menu-item img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin-right:15px;background:#eee;}
        .menu-item-info{flex-grow:1;}
        .menu-item-title{font-size:1.1em;font-weight:bold;color:#333;margin-bottom:5px;}
        .menu-item-price{color:#e91e63;font-weight:bold;font-size:1.1em;}
        .qty-controls{display:flex;align-items:center;}
        .qty-btn{width:30px;height:30px;border:1px solid #ccc;background:#fff;border-radius:5px;font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .qty-input{width:40px;text-align:center;border:none;font-size:1.1em;font-weight:bold;margin:0 5px;background:transparent;}
        .cart-bar{position:fixed;bottom:0;left:0;width:100%;background:#333;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;z-index:20;}
        .cart-bar.disabled{background:#999;cursor:not-allowed;}
        .cart-total-text{font-size:1.2em;font-weight:bold;}
        .cart-btn-text{background:#e91e63;padding:8px 15px;border-radius:20px;font-weight:bold;}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:30;justify-content:center;align-items:flex-end;}
        .modal-content{background:#fff;width:100%;max-height:90vh;border-radius:20px 20px 0 0;padding:25px 20px;overflow-y:auto;animation:slideUp .3s ease-out;}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:10px;}
        .modal-header h3{margin:0;font-size:1.3em;}
        .close-btn{font-size:1.5em;color:#999;cursor:pointer;border:none;background:none;}
        .form-group{margin-bottom:15px;}
        .form-group label{display:block;font-weight:bold;margin-bottom:5px;color:#555;}
        .form-group input,.form-group select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:1em;}
        .submit-btn{width:100%;padding:15px;background:#8b0000;color:#fff;border:none;border-radius:8px;font-size:1.2em;font-weight:bold;margin-top:10px;cursor:pointer;}
        .submit-btn:disabled{background:#ccc;cursor:not-allowed;}
        .submit-btn.green{background:#2e7d32;}
        .submit-btn.gray{background:#555;}
        .payment-section{background:#fff8e1;border:1px solid #ffd54f;border-radius:10px;padding:15px;margin-bottom:15px;}
        .payment-section h4{margin:0 0 10px;color:#e65100;font-size:1em;}
        .pay-row{display:flex;gap:10px;margin-bottom:10px;}
        .pay-row button{flex:1;padding:10px;border:2px solid #ccc;border-radius:8px;background:#fff;font-size:.95em;font-weight:bold;cursor:pointer;transition:all .2s;}
        .pay-row button.sel{border-color:#8b0000;background:#8b0000;color:#fff;}
        .dep-wrap{display:none;}
        .dep-wrap.show{display:block;}
        .order-summary{background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:15px;font-size:.95em;}
        .order-summary .tot{font-weight:bold;font-size:1.1em;color:#8b0000;margin-top:8px;}
        .paid-notice{background:#fff3e0;border-left:4px solid #ff9800;padding:12px 15px;border-radius:6px;margin-bottom:15px;font-size:.9em;color:#555;}
        #loading{text-align:center;padding:30px;color:#666;font-weight:bold;}
        #posEntryBtn{display:none;position:fixed;top:65px;right:12px;z-index:15;background:#ff6f00;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;font-size:.9em;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;}
    </style>
</head>
<body>

<div class="header" id="pageHeader">祥和蔬食料理 - 年菜預購</div>
<div id="loading">載入最新菜單與庫存中...</div>
<div class="menu-container" id="menuList" style="display:none;"></div>

<div class="cart-bar disabled" id="cartBar" onclick="openCart()">
    <span class="cart-total-text" id="cartTotal">合計: NT$ 0</span>
    <span class="cart-btn-text">填寫訂單 ➔</span>
</div>

<button id="posEntryBtn" onclick="openPosModal()">🖥️ 門市點餐</button>
<button id="posSearchBtn" onclick="openSearchModal()" style="display:none;position:fixed;top:115px;right:12px;z-index:15;background:#1565c0;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;font-size:.9em;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;">🔍 修改訂單</button>

<!-- POS 搜尋 Modal -->
<div class="modal-overlay" id="searchModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔍 搜尋顧客訂單</h3>
            <button class="close-btn" onclick="closeModal('searchModal')">×</button>
        </div>
        <div class="form-group">
            <label>輸入顧客電話查詢</label>
            <div style="display:flex;gap:8px;">
                <input type="tel" id="searchPhone" placeholder="例如: 0912345678" style="flex:1;">
                <button onclick="doSearch()" style="padding:12px 16px;background:#1565c0;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;white-space:nowrap;">查詢</button>
            </div>
        </div>
        <div id="searchResults" style="margin-top:10px;"></div>
    </div>
</div>

<!-- 一般顧客訂單 Modal -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">填寫訂購資訊</h3>
            <button class="close-btn" onclick="closeModal('orderModal')">×</button>
        </div>
        <div class="paid-notice" id="paidNotice" style="display:none;">
            ⚠️ 您的訂單已付款，修改後狀態將重置為「未付」，需重新完成付款流程。
        </div>
        <div class="form-group"><label>取貨門市</label>
            <input type="text" value="祥和蔬食料理 鎮江店" readonly style="background:#f5f5f5;color:#555;cursor:not-allowed;"></div>
        <div class="form-group"><label>取貨日期</label>
            <select id="pickupDate" required>
                <option value="">請選擇取貨日期</option>
                <option value="2027-02-04">2027 年 02 月 04 日（除夕）</option>
                <option value="2027-02-05">2027 年 02 月 05 日（初一）</option>
            </select></div>
        <div class="form-group"><label>取貨時間</label>
            <select id="pickupTime">
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:30">15:30</option>
            </select></div>
        <div class="form-group"><label>訂購人姓名</label><input type="text" id="custName" placeholder="請填寫真實姓名" required></div>
        <div class="form-group"><label>連絡電話</label><input type="tel" id="custPhone" placeholder="例如: 0912345678" required></div>
        <button class="submit-btn" id="submitBtn" onclick="submitOrder()">確認送出訂單</button>
    </div>
</div>

<!-- POS 門市訂單 Modal -->
<div class="modal-overlay" id="posModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🖥️ 門市現場建立訂單</h3>
            <button class="close-btn" onclick="closeModal('posModal')">×</button>
        </div>
        <div class="form-group"><label>取貨門市</label>
            <input type="text" value="祥和蔬食料理 鎮江店" readonly style="background:#f5f5f5;color:#555;cursor:not-allowed;"></div>
        <div class="form-group"><label>取貨日期</label>
            <select id="posPickupDate" required>
                <option value="">請選擇取貨日期</option>
                <option value="2027-02-04">2027 年 02 月 04 日（除夕）</option>
                <option value="2027-02-05">2027 年 02 月 05 日（初一）</option>
            </select></div>
        <div class="form-group"><label>取貨時間</label>
            <select id="posPickupTime">
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:30">15:30</option>
            </select></div>
        <div class="form-group"><label>顧客姓名</label><input type="text" id="posCustName" placeholder="顧客姓名" required></div>
        <div class="form-group"><label>連絡電話</label><input type="tel" id="posCustPhone" placeholder="例如: 0912345678" required></div>

        <div class="payment-section">
            <h4>💰 現場付款方式</h4>
            <div class="pay-row">
                <button id="pBtn0" onclick="selPay('none')">尚未付款</button>
                <button id="pBtn1" onclick="selPay('deposit')">付訂金</button>
                <button id="pBtn2" onclick="selPay('full')">全額付清</button>
            </div>
            <div class="dep-wrap" id="depWrap">
                <div class="form-group" style="margin-bottom:0;">
                    <label>訂金金額 (NT$)</label>
                    <input type="number" id="depositAmt" placeholder="請輸入訂金金額" min="1">
                </div>
            </div>
        </div>

        <div class="order-summary" id="posSummary" style="display:none;">
            <div id="summaryItems"></div>
            <div class="tot" id="summaryTotal"></div>
        </div>

        <!-- POS 查詢既有訂單 -->
        <div style="border-top:1px dashed #ccc;margin:15px 0;padding-top:15px;">
            <h4 style="margin:0 0 10px;color:#555;font-size:.95em;">🔍 查詢並修改既有訂單</h4>
            <div class="form-group" style="margin-bottom:8px;">
                <input type="tel" id="posSearchPhone" placeholder="輸入顧客電話查詢訂單">
            </div>
            <button onclick="posSearchOrder()" style="width:100%;padding:10px;background:#555;color:#fff;border:none;border-radius:8px;font-size:.95em;font-weight:bold;cursor:pointer;margin-bottom:10px;">🔍 查詢訂單</button>
            <div id="posSearchResult" style="display:none;background:#f9f9f9;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:.9em;margin-bottom:10px;"></div>
            <button id="posModifyBtn" onclick="submitPosModify()" style="display:none;width:100%;padding:12px;background:#1565c0;color:#fff;border:none;border-radius:8px;font-size:1em;font-weight:bold;cursor:pointer;">📝 送出修改（差額/退款通知員工）</button>
        </div>

        <button class="submit-btn green" id="posSubmitBtn" onclick="submitPosOrder()">✅ 建立門市訂單</button>
    </div>
</div>

<!-- 修改/新增選擇 Modal -->
<div id="choiceModal" class="modal-overlay" style="align-items:center;">
    <div class="modal-content" style="border-radius:15px;margin:20px;text-align:center;">
        <h3>您有一筆未完成的訂單</h3>
        <p style="margin-bottom:20px;">請問您想要？</p>
        <button class="submit-btn" onclick="startEdit(true)">修改原訂單</button>
        <button class="submit-btn gray" style="margin-top:15px;" onclick="startEdit(false)">再開一筆新訂單</button>
    </div>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwWPu_pZsN9EoFVYJmyUhndaj6IfO2ekHi1jnB7lJMO2I0MDemfZSNWlDkiQUIyUK8u/exec';
    const menuItems = [
        {name:"祥和拼盤",price:800},{name:"佛跳牆",price:1380},{name:"肉骨茶鍋",price:1380},
        {name:"酸白菜鍋",price:860},{name:"麻油鍋",price:860},{name:"紅燒獅子頭",price:640},
        {name:"清蒸臭豆腐",price:640},{name:"麻辣臭豆腐",price:600},{name:"三杯猴頭菇",price:760},
        {name:"宮保素雞丁",price:600},{name:"糖醋素肉",price:600},{name:"素杏鮑牛腩煲",price:720},
        {name:"酸白菜素牛肉",price:560},{name:"麻油素腰花",price:760},{name:"蓉城口水雞",price:760},
        {name:"祥和素油雞",price:640},{name:"松露油飯",price:380},{name:"椒麻油飯",price:300},
        {name:"炒炊粉",price:180},{name:"原味蘿蔔糕",price:200},{name:"酥香蘿蔔糕",price:280}
    ];

    let total=0, qty=new Array(menuItems.length).fill(0);
    let inv={}, lastOrder=null, action='new', posPayMode='none';
    let isPosMode=false, posFoundOrder=null, currentEditOrder=null;

    // ── 初始化 ──
    (function init() {
        const params = new URLSearchParams(location.search);
        isPosMode = params.get('pos') === '1';

        if (isPosMode) {
            document.getElementById('pageHeader').innerHTML =
                '祥和蔬食料理 - 年菜預購 <span class="pos-badge">門市POS</span>';
            document.getElementById('posEntryBtn').style.display = 'block';
            document.getElementById('posSearchBtn').style.display = 'block';
            document.getElementById('cartBar').style.display = 'none';
            loadInventory();
        } else {
            const script = document.createElement('script');
            script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
            script.onload = function() {
                liff.init({ liffId: '2009843210-1DLZ73WP' }).then(() => {
                    if (!liff.isLoggedIn()) { liff.login(); }
                    else { loadWithHistory(); }
                }).catch(err => {
                    document.getElementById('loading').innerText = 'LIFF 初始化失敗：' + err;
                });
            };
            document.head.appendChild(script);
        }
    })();

    // ── 載入資料（加入 15 秒超時機制） ──
    function loadInventory() {
        const loadingEl = document.getElementById('loading');
        loadingEl.innerText = '載入最新菜單與庫存中...';

        // 15秒超時保護
        const timer = setTimeout(() => {
            loadingEl.innerHTML = '⚠️ 載入超時，請確認網路連線後<br><button onclick="loadInventory()" style="margin-top:10px;padding:10px 20px;background:#8b0000;color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;">🔄 重新載入</button>';
        }, 15000);

        fetch(GAS_URL + '?pos=1')
            .then(r => r.json())
            .then(res => {
                clearTimeout(timer);
                inv = res.inventory || {};
                showMenu();
            })
            .catch(err => {
                clearTimeout(timer);
                loadingEl.innerHTML = '❌ 載入失敗：' + err + '<br><button onclick="loadInventory()" style="margin-top:10px;padding:10px 20px;background:#8b0000;color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;">🔄 重新載入</button>';
            });
    }

    function loadWithHistory() {
        const profile = liff.getDecodedIDToken();
        fetch(GAS_URL + '?userId=' + profile.sub).then(r=>r.json()).then(res=>{
            inv = res.inventory || {};
            if (res.lastOrder) {
                lastOrder = res.lastOrder;
                const diff = Math.ceil((new Date(lastOrder.date)-new Date())/(86400000));
                if (diff <= 3) {
                    alert('您有一筆近期訂單（3天內取貨），已進入備餐階段無法線上修改。\n如需更改請致電門市。您仍可建立新訂單。');
                    startEdit(false);
                } else {
                    document.getElementById('choiceModal').style.display='flex';
                }
            } else {
                startEdit(false);
            }
        }).catch(err=>{
            document.getElementById('loading').innerText='載入失敗，請重新整理。';
        });
    }

    function startEdit(isEdit) {
        document.getElementById('choiceModal').style.display='none';
        if (isEdit) {
            action='update';
            let h = lastOrder.items;
            qty = h.slice(0,16).concat(h.slice(17,22)).map(v=>parseInt(v)||0);
            document.getElementById('custName').value   = lastOrder.name;
            document.getElementById('custPhone').value  = lastOrder.phone;
            document.getElementById('pickupDate').value = lastOrder.date;
            if (lastOrder.paymentStatus && lastOrder.paymentStatus!=='未付') {
                document.getElementById('paidNotice').style.display='block';
            }
        } else {
            action='new';
        }
        showMenu();
    }

    function showMenu() {
        document.getElementById('loading').style.display='none';
        document.getElementById('menuList').style.display='block';
        renderMenu();
        calcTotal();
    }

    // ── 渲染菜單 ──
    function renderMenu() {
        const c = document.getElementById('menuList');
        c.innerHTML='';
        menuItems.forEach((item,i)=>{
            const stock = inv[item.name]!==undefined ? parseInt(inv[item.name]) : 999;
            const soldOut = stock<=0;
            const q = qty[i]||0;
            const div=document.createElement('div');
            div.className='menu-item'+(soldOut?' sold-out':'');
            const ctrl = soldOut
                ? '<div class="sold-out-badge">已售完</div>'
                : `<div class="qty-controls">
                     <button class="qty-btn" onclick="upd(${i},-1)">-</button>
                     <input class="qty-input" id="q${i}" value="${q}" readonly>
                     <button class="qty-btn" onclick="upd(${i},1)">+</button>
                   </div>`;
            div.innerHTML=`
                <img src="https://via.placeholder.com/80?text=圖片" alt="${item.name}">
                <div class="menu-item-info">
                    <div class="menu-item-title">${item.name}</div>
                    <div class="menu-item-price">NT$ ${item.price}</div>
                </div>${ctrl}`;
            c.appendChild(div);
        });
    }

    function upd(i,d){
        qty[i]=Math.max(0,qty[i]+d);
        document.getElementById('q'+i).value=qty[i];
        calcTotal();
        if(document.getElementById('posModal').style.display==='flex') updatePosSummary();
    }

    function calcTotal(){
        total=menuItems.reduce((s,item,i)=>s+item.price*qty[i],0);
        document.getElementById('cartTotal').innerText='合計: NT$ '+total;
        document.getElementById('cartBar').classList.toggle('disabled',total<=0);
    }

    // ── POS 付款方式 ──
    function selPay(mode){
        posPayMode=mode;
        ['none','deposit','full'].forEach((m,i)=>{
            document.getElementById('pBtn'+i).classList.toggle('sel',m===mode);
        });
        document.getElementById('depWrap').classList.toggle('show',mode==='deposit');
    }

    function updatePosSummary(){
        const items=menuItems.map((item,i)=>qty[i]>0?`${item.name} × ${qty[i]}`:null).filter(Boolean);
        document.getElementById('summaryItems').innerHTML=items.join('<br>')||'（尚未選擇）';
        document.getElementById('summaryTotal').innerText='總金額：NT$ '+total;
        document.getElementById('posSummary').style.display='block';
    }

    function openPosModal(){
        selPay('none');
        updatePosSummary();
        document.getElementById('posModal').style.display='flex';
    }

    // ── POS 建立新訂單 ──
    function submitPosOrder(){
        const name  = document.getElementById('posCustName').value.trim();
        const phone = document.getElementById('posCustPhone').value.trim();
        const date  = document.getElementById('posPickupDate').value;
        if(!name||!phone||!date){ alert('請填寫完整姓名、電話與取貨日期！'); return; }
        if(total<=0){ alert('請先選擇餐點！'); return; }

        let depAmt=0, payStatus='未付';
        if(posPayMode==='full'){
            payStatus='付清'; depAmt=total;
        } else if(posPayMode==='deposit'){
            depAmt=parseInt(document.getElementById('depositAmt').value)||0;
            if(depAmt<=0){alert('請輸入訂金金額！');return;}
            if(depAmt>=total){alert('訂金不可大於等於總金額，全付請選「全額付清」！');return;}
            payStatus='付訂金';
        }

        setBtnState('posSubmitBtn','建立中...',true);
        fetch(GAS_URL,{
            method:'POST',mode:'no-cors',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                userId:'POS_STORE', action:'new', orderId:null,
                name, phone,
                branch:'祥和蔬食料理 鎮江店',
                date,
                time: document.getElementById('posPickupTime').value,
                totalAmount:total,
                items_qty_array:qty,
                source:'POS', payStatus, depositAmount:depAmt
            })
        }).then(()=>{
            alert('門市訂單已建立！\n顧客：'+name+'\n狀態：'+payStatus+(depAmt>0&&payStatus!=='付清'?'\n訂金：NT$ '+depAmt:''));
            closeModal('posModal');
            qty=new Array(menuItems.length).fill(0);
            renderMenu(); calcTotal();
            document.getElementById('posCustName').value='';
            document.getElementById('posCustPhone').value='';
        }).catch(()=>alert('建立失敗，請稍後再試。'))
          .finally(()=>setBtnState('posSubmitBtn','✅ 建立門市訂單',false));
    }

    // ── POS 搜尋既有訂單（Modal 內）──
    function posSearchOrder() {
        const phone = document.getElementById('posSearchPhone').value.trim();
        if (!phone) { alert('請輸入顧客電話！'); return; }

        const resultDiv = document.getElementById('posSearchResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '查詢中...';
        document.getElementById('posModifyBtn').style.display = 'none';
        posFoundOrder = null;

        fetch(GAS_URL + '?posSearch=' + encodeURIComponent(phone))
            .then(r => r.json())
            .then(res => {
                if (!res.orders || res.orders.length === 0) {
                    resultDiv.innerHTML = '❌ 查無此電話的訂單。';
                    return;
                }
                const o = res.orders[0];
                posFoundOrder = o;
                resultDiv.innerHTML =
                    '<b>✅ 找到訂單 #' + o.orderId + '</b><br>' +
                    '顧客：' + o.name + '<br>' +
                    '狀態：' + o.status + '<br>' +
                    '目前總額：NT$ ' + o.total + '<br>' +
                    '已付：NT$ ' + (o.paid || 0) + '<br>' +
                    '<hr style="margin:8px 0;border-color:#eee;">' +
                    '<b>📌 請在上方調好新的餐點數量後，點下方「送出修改」</b>';
                if (o.items && o.items.length) {
                    qty = o.items.slice(0,16).concat(o.items.slice(17,22)).map(v=>parseInt(v)||0);
                    renderMenu(); calcTotal();
                }
                document.getElementById('posModifyBtn').style.display = 'block';
            })
            .catch(() => { resultDiv.innerHTML = '❌ 查詢失敗，請稍後再試。'; });
    }

    // ── POS 送出修改 ──
    function submitPosModify() {
        if (!posFoundOrder) { alert('請先查詢訂單！'); return; }
        if (total <= 0) { alert('餐點數量不能為0，如需取消請聯繫顧客。'); return; }

        const oldTotal = Number(posFoundOrder.total) || 0;
        const newTotal = total;
        if (oldTotal === newTotal) { alert('金額與原訂單相同，無需修改。'); return; }

        const diff = Math.abs(newTotal - oldTotal);
        const modType = newTotal > oldTotal ? '加訂' : '少訂';
        const diffLabel = newTotal > oldTotal
            ? '追加差額：NT$ ' + diff
            : '退款差額：NT$ ' + diff;

        // ★ 修正後的 confirm（只有一個）
        if (!confirm(
            '確認送出修改？\n\n' +
            '訂單 #' + posFoundOrder.orderId + '\n' +
            '顧客：' + posFoundOrder.name + '\n' +
            '原金額：NT$ ' + oldTotal + '\n' +
            '新金額：NT$ ' + newTotal + '\n' +
            modType + '（' + diffLabel + '）\n\n' +
            '系統將自動通知員工確認。'
        )) return;

        setBtnState('posModifyBtn','送出中...',true);
        fetch(GAS_URL, {
            method:'POST', mode:'no-cors',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                userId: posFoundOrder.lineId || 'POS_STORE',
                action: 'update',
                orderId: posFoundOrder.orderId,
                name: posFoundOrder.name,
                phone: posFoundOrder.phone,
                branch: '祥和蔬食料理 鎮江店',
                date: posFoundOrder.date,
                time: posFoundOrder.time || '12:00',
                totalAmount: newTotal,
                items_qty_array: qty,
                source: 'POS'
            })
        }).then(() => {
            alert('修改申請已送出！\n' + modType + '（' + diffLabel + '）\n系統正在通知員工確認。');
            posFoundOrder = null;
            document.getElementById('posSearchResult').style.display = 'none';
            document.getElementById('posModifyBtn').style.display = 'none';
            document.getElementById('posSearchPhone').value = '';
            qty = new Array(menuItems.length).fill(0);
            renderMenu(); calcTotal();
        }).catch(() => alert('送出失敗，請稍後再試。'))
          .finally(() => setBtnState('posModifyBtn','📝 送出修改（差額/退款通知員工）',false));
    }

    // ── 搜尋 Modal（右上角按鈕）──
    function openSearchModal(){
        document.getElementById('searchPhone').value='';
        document.getElementById('searchResults').innerHTML='';
        document.getElementById('searchModal').style.display='flex';
    }

    function doSearch(){
        const phone = document.getElementById('searchPhone').value.trim();
        if(!phone){ alert('請輸入電話號碼！'); return; }
        document.getElementById('searchResults').innerHTML='<p style="color:#888;text-align:center;">搜尋中...</p>';
        fetch(GAS_URL+'?posSearch='+encodeURIComponent(phone))
            .then(r=>r.json()).then(res=>{
            const container = document.getElementById('searchResults');
            if(!res.orders||!res.orders.length){
                container.innerHTML='<p style="color:#d32f2f;text-align:center;">找不到此電話的訂單</p>';
                return;
            }
            const statusColor={'付清':'#2e7d32','付訂金':'#e65100','未付':'#d32f2f','退款待處理':'#1565c0','已取消':'#999'};
            container.innerHTML = res.orders.map(o=>`
                <div style="border:1px solid #eee;border-radius:10px;padding:14px;margin-bottom:10px;background:#fafafa;">
                    <b>#${o.orderId}</b> ${o.name}<br>
                    <span style="font-size:.85em;color:#666;">${o.date} ${o.time} | <span style="color:${statusColor[o.status]||'#333'};">${o.status}</span></span><br>
                    <span style="font-size:.85em;">總額：NT$ ${o.total}${o.paid>0?' | 已付：NT$ '+o.paid:''}${o.unpaid>0?' | 未付：NT$ '+o.unpaid:''}</span>
                    <div style="margin-top:10px;">
                        <button onclick="loadOrderForEdit(${JSON.stringify(o).replace(/"/g,'&quot;')})" style="width:100%;padding:8px;background:#1565c0;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">✏️ 加減訂購</button>
                    </div>
                </div>
            `).join('');
        }).catch(()=>{
            document.getElementById('searchResults').innerHTML='<p style="color:#d32f2f;text-align:center;">搜尋失敗，請重試</p>';
        });
    }

    function loadOrderForEdit(order){
        currentEditOrder = order;
        closeModal('searchModal');
        const h = order.items;
        qty = h.slice(0,16).concat(h.slice(17,22)).map(v=>parseInt(v)||0);
        renderMenu(); calcTotal();
        document.getElementById('posCustName').value  = order.name;
        document.getElementById('posCustPhone').value = order.phone;
        if(order.date) document.getElementById('posPickupDate').value = order.date;
        selPay('none'); updatePosSummary();
        document.getElementById('posModal').style.display='flex';

        let notice = document.getElementById('posEditNotice');
        if(!notice){
            notice = document.createElement('div');
            notice.id = 'posEditNotice';
            notice.style.cssText='background:#e3f2fd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px;margin-bottom:15px;font-size:.9em;color:#1565c0;';
            document.getElementById('posSubmitBtn').parentNode.insertBefore(notice, document.getElementById('posSubmitBtn'));
        }
        const stColor={'付清':'#2e7d32','付訂金':'#e65100','未付':'#d32f2f'}[order.status]||'#333';
        notice.innerHTML = '✏️ 修改模式 — 訂單 <b>#'+order.orderId+'</b> ('+order.name+')<br>' +
            '<span style="font-size:.85em;">原狀態：<b style="color:'+stColor+'">'+order.status+'</b> | 原總額：NT$ '+order.total+(order.paid>0?' | 已付：NT$'+order.paid:'')+'</span>';
        document.getElementById('posSubmitBtn').innerText = '✅ 確認修改訂單';
        document.getElementById('posSubmitBtn').onclick = submitPosModifyOrder;
    }

    function submitPosModifyOrder(){
        if(!currentEditOrder){ alert('錯誤：沒有選取訂單'); return; }
        const name  = document.getElementById('posCustName').value.trim();
        const phone = document.getElementById('posCustPhone').value.trim();
        const date  = document.getElementById('posPickupDate').value;
        if(!name||!phone||!date){ alert('請填寫完整姓名、電話與取貨日期！'); return; }
        if(total<=0){ alert('請至少選擇一道餐點！'); return; }

        const newTotal = total;
        const oldTotal = Number(currentEditOrder.total)||0;
        const paidAmt  = Number(currentEditOrder.paid)||0;
        const oldStatus= currentEditOrder.status;

        let modDesc='';
        if(newTotal>oldTotal) modDesc='加訂：需補繳 NT$ '+(newTotal-oldTotal);
        else if(newTotal<oldTotal) modDesc=newTotal===0?'取消訂單：退款 NT$ '+paidAmt:'少訂：退款 NT$ '+Math.max(0,paidAmt-newTotal);
        else modDesc='金額未變，僅更新內容';

        if(!confirm('確認修改訂單 #'+currentEditOrder.orderId+'？\n'+modDesc)) return;

        setBtnState('posSubmitBtn','修改中...',true);
        fetch(GAS_URL,{
            method:'POST',mode:'no-cors',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                userId: currentEditOrder.lineId||'POS_STORE',
                action: 'update',
                orderId: currentEditOrder.orderId,
                name, phone,
                branch:'祥和蔬食料理 鎮江店',
                date,
                time: document.getElementById('posPickupTime').value,
                totalAmount: newTotal,
                items_qty_array: qty,
                source:'POS',
                payStatus: currentEditOrder.status
            })
        }).then(()=>{
            alert('訂單 #'+currentEditOrder.orderId+' 修改完成！\n'+modDesc+((oldStatus==='付清'||oldStatus==='付訂金')&&newTotal!==oldTotal?'\n📢 已通知員工審核差額。':''));
            closeModal('posModal');
            currentEditOrder=null;
            qty=new Array(menuItems.length).fill(0);
            renderMenu(); calcTotal();
            document.getElementById('posSubmitBtn').innerText='✅ 建立門市訂單';
            document.getElementById('posSubmitBtn').onclick=submitPosOrder;
            const notice=document.getElementById('posEditNotice');
            if(notice) notice.remove();
        }).catch(()=>alert('修改失敗，請稍後再試。'))
          .finally(()=>setBtnState('posSubmitBtn','✅ 確認修改訂單',false));
    }

    // ── 一般顧客訂單 ──
    function openCart(){
        if(total>0) document.getElementById('orderModal').style.display='flex';
        else alert('購物車是空的，請先選擇餐點唷！');
    }

    function submitOrder(){
        const name  = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const date  = document.getElementById('pickupDate').value;
        if(!name||!phone||!date){ alert('請填寫完整姓名、電話與取貨日期！'); return; }
        setBtnState('submitBtn','訂單傳送中...',true);
        liff.getProfile().then(profile=>{
            return fetch(GAS_URL,{
                method:'POST',mode:'no-cors',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    userId: profile.userId,
                    action,
                    orderId: action==='update'?lastOrder.orderId:null,
                    name, phone,
                    branch:'祥和蔬食料理 鎮江店',
                    date,
                    time: document.getElementById('pickupTime').value,
                    totalAmount: total,
                    items_qty_array: qty,
                    source:'LINE'
                })
            });
        }).then(()=>{
            alert(action==='update'?'訂單已成功修改！請留意官方帳號訊息。':'訂單已成功送出！請留意官方帳號訊息。');
            liff.closeWindow();
        }).catch(()=>{
            alert('送出失敗，請稍後再試。');
            setBtnState('submitBtn','確認送出訂單',false);
        });
    }

    // ── 工具 ──
    function closeModal(id){ document.getElementById(id).style.display='none'; }
    function setBtnState(id,txt,disabled){
        const b=document.getElementById(id);
        b.innerText=txt; b.disabled=disabled;
    }
</script>
</body>
</html>
